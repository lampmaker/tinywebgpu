<!DOCTYPE html>
<!-- TinyWebGPU example 2: compute → storage buffer → readback. No canvas needed.
     Serve this folder (python3 -m http.server) and open /examples/2_compute_readback.html -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TinyWebGPU — compute readback</title>
  <!-- Loaded first and on purpose not a module: it turns an uncaught error in the
       module scripts below — no WebGPU, no adapter, a file that failed to load — into
       a banner on the page, because a phone has no console to print it to. -->
  <script src="../diag.js"></script>
  <style>
    body {
      margin: 0; padding: 1rem; background: #111; color: #ddd;
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
    }
    /* Wrap rather than scroll sideways: these examples print long lines. */
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <pre id="out">running…</pre>
  <script type="module">
    import { boot } from '../libselect.js';
    // No canvas argument: compute-only. boot also reports a failed start-up on the page.
    const { G } = await boot(['read']);   // ?lib=min|tiny switches the build
    const N = 16;

    const p = G.makeCompute('', `
        let i = gid.x;
        if (i < UB.n) { data[i] = f32(i) * f32(i); }
      `,
      { n: 'u32' },                            // uniforms
      { data: 'array<f32>' },                  // resources
      { wg: [64, 1, 1] });

    const buf = G.createStorageBuffer(N * 4);
    p.setResources({ data: buf.b });
    p.setUniforms({ n: N });
    p.dispatch(Math.ceil(N / 64));

    const squares = await buf.r(N * 4, 0, Float32Array);   // debug readback (stalls the pipeline)
    document.getElementById('out').textContent = 'squares: ' + [...squares].join(', ');
    window.__result = { ok: squares[5] === 25, msg: [...squares].join(',') };
  </script>
</body>

</html>
