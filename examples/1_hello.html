<!DOCTYPE html>
<!-- TinyWebGPU example 1: hello fullscreen shader.
     Serve this folder (python3 -m http.server) and open /examples/1_hello.html -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TinyWebGPU — hello shader</title>
  <!-- Loaded first and on purpose not a module: it turns an uncaught error in the
       module scripts below — no WebGPU, no adapter, a file that failed to load — into
       a banner on the page, because a phone has no console to print it to. -->
  <script src="../diag.js"></script>
  <style>
    body {
      margin: 0; min-height: 100vh; padding: 1rem; display: grid; place-items: center;
      background: #111; color: #ddd;
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    /* Takes the width it is given and keeps its shape, so it fits any phone. */
    canvas {
      display: block; width: 100%; max-width: 800px; height: auto;
      aspect-ratio: 16 / 9;
    }
  </style>
</head>

<body>
  <canvas id="c" width="800" height="450"></canvas>
  <script type="module">
    import { boot } from '../libselect.js';
    // boot = the ?lib=min|tiny picker, the import of that build, and init() — with any
    // start-up failure (no WebGPU, no adapter) put on the page instead of only the console.
    const { G } = await boot([], '..', document.getElementById('c'));
    const quad = G.makeQuad({
      frag: `fn frag(uv: vec2<f32>) -> vec4<f32> {
        return vec4<f32>(0.5 + 0.5 * cos(UB.time + uv.xyx * 4.0 + vec3<f32>(0.0, 2.0, 4.0)), 1.0);
      }`,
      uniforms: { time: 'f32' },
    });
    const loop = t => { quad.run({ time: t * 0.001 }); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  </script>
</body>

</html>
