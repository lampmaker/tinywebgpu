<!DOCTYPE html>
<!-- TinyWebGPU example 4: indirect dispatch with GPU-side counters
     (the wavefront pattern, distilled). A filter kernel compacts survivors and counts
     them atomically; a prep kernel converts the count into dispatch args; the next
     kernel runs with exactly that many workgroups — no CPU round-trip in the frame.
     Serve this folder (python3 -m http.server) and open /examples/4_indirect.html -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TinyWebGPU — indirect dispatch</title>
  <style>
    body {
      margin: 0; padding: 1rem; background: #111; color: #ddd;
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
    }
    /* Wrap rather than scroll sideways: these examples print long lines. */
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <pre id="out">running…</pre>
  <script type="module">
    import { loadLib } from '../libselect.js';
    const { WEBGPU } = await loadLib(['read'], '..');   // ?lib=min|tiny switches the build

    const G = await WEBGPU().init();          // no canvas needed
    const N = 1000;

    // 1) keep multiples of 7, compact them into `survivors`, count atomically
    const filter = await G.makeCompute('', `
        let i = gid.x;
        if (i >= ${N}u) { return; }
        if (i % 7u == 0u) {
          let slot = atomicAdd(&counters.n, 1u);
          survivors[slot] = i;
        }
      `,
      {}, { counters: 'struct Counters { n: atomic<u32> }', survivors: 'array<u32>' },
      { wg: [64, 1, 1] });

    // 2) turn the count into [x,y,z] dispatch args for wg=64
    const prep = await G.makeCompute('', `
        if (gid.x == 0u) {
          args[0] = (counters.n + 63u) / 64u;
          args[1] = 1u;
          args[2] = 1u;
        }
      `,
      {}, { counters: 'struct Counters { n: u32 }', args: 'array<u32>' },
      { wg: [1, 1, 1] });

    // 3) sum the survivors — dispatched indirectly with the GPU-computed workgroup count
    const sum = await G.makeCompute('', `
        let i = gid.x;
        if (i < counters.n) { atomicAdd(&total.v, survivors[i]); }
      `,
      {}, { counters: 'struct C2 { n: u32 }', survivors: 'array<u32>', total: 'struct Total { v: atomic<u32> }' },
      { wg: [64, 1, 1] });

    const counters = G.createStorageBuffer(4);
    const survivors = G.createStorageBuffer(N * 4);
    const total = G.createStorageBuffer(4);
    const indirect = G.createIndirectBuffer();     // 3×u32, INDIRECT | STORAGE

    filter.setResources({ counters: counters.b, survivors: survivors.b });
    prep.setResources({ counters: counters.b, args: indirect.b });
    sum.setResources({ counters: counters.b, survivors: survivors.b, total: total.b });

    G.beginFrame();                                        // all three passes, one submit
    filter.dispatch(Math.ceil(N / 64));
    prep.dispatch(1);
    sum.dispatchIndirect(indirect.b, 0);
    G.endFrame();

    const [count] = await counters.r(4, 0, Uint32Array);
    const [totalV] = await total.r(4, 0, Uint32Array);
    // multiples of 7 below 1000: count 143, sum 7·(0+1+…+142) = 71071
    const ok = count === 143 && totalV === 71071;
    document.getElementById('out').textContent =
      `survivors: ${count} (expected 143)\nsum: ${totalV} (expected 71071)\n${ok ? 'PASS' : 'FAIL'}`;
    window.__result = { ok, msg: `count=${count} sum=${totalV}` };
  </script>
</body>

</html>
